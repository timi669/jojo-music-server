spring:
  # 配置数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://YOUR_MYSQL_HOST:3306/jojo_music?useUnicode=true&characterEncoding=utf-8&useSSL=false # 修改你的 MySQL 地址和库名
    username: YOUR_MYSQL_USER # 修改你的 MySQL 用户名
    password: YOUR_MYSQL_PASSWORD # 修改你的 MySQL 密码
    type: com.alibaba.druid.pool.DruidDataSource # 配置连接池

  # Redis服务连接配置
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      password:

  servlet:
    multipart:
      max-file-size: 100MB # 设置最大上传文件大小为100MB
      max-request-size: 100MB # 设置最大请求大小为100MB

  # 配置邮件服务；未提供 SMTP 环境变量时保留为空，邮件功能会明确返回未配置
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

media:
  audio-validation:
      # Full audio validation requires FFmpeg and FFprobe on PATH or configured via these environment variables.
      ffprobe-path: ${MEDIA_FFPROBE_PATH:ffprobe}
      ffmpeg-path: ${MEDIA_FFMPEG_PATH:ffmpeg}
      timeout-seconds: ${MEDIA_VALIDATION_TIMEOUT_SECONDS:120}

  # 对于注解的Redis缓存数据统一设置有效期为10分钟，单位毫秒
  cache:
    redis:
      time-to-live: 600000

# 应用级安全配置
app:
  jwt:
    # JWT 签名密钥。**生产环境必须通过环境变量 APP_JWT_SECRET 显式设置**。
    # 留空时后端会回退到开发用默认值并在启动日志中告警。
    # 硬编码弱密钥的风险：任何拿到源码/仓库的人都能伪造管理员 token，
    # 从而绕过全部登录流程。
    secret: ${APP_JWT_SECRET:}

  cors:
    # 允许跨域访问的来源（逗号分隔，需完整包含协议与端口）。
    # 默认只放行本地开发端口；部署到其他域名时必须显式追加，
    # 不要改回通配符 "*"。
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8090,http://localhost:8089}

# 配置 mybatis-plus
mybatis-plus:
  type-aliases-package: cn.edu.seig.pojo # 实体类所在的包，允许用实体类类名作为别名

  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 配置日志
    map-underscore-to-camel-case: true # 类属性与表字段的驼峰映射

  global-config:
    db-config: # 数据库配置
      table-prefix: tb_  # 表名前缀为tb_，表名为前缀连接类名（小写）

# 定义角色和路径权限的映射关系
role-path-permissions:
  permissions:
    ROLE_ADMIN:
      - "/admin/"
    ROLE_USER:
      - "/user/"
      - "/playlist/"
      - "/artist/"
      - "/song/"
      - "/favorite/"
      - "/comment/"
      - "/banner/"
      - "/feedback/"

minio:
  endpoint: http://YOUR_MINIO_HOST:9000 # 修改你的 MinIO 端点
  accessKey: YOUR_MINIO_ACCESS_KEY # 修改你的 MinIO Access Key
  secretKey: YOUR_MINIO_SECRET_KEY # 修改你的 MinIO Secret Key
  bucket: jojo-music-data # 确认 Bucket 名称与你创建的一致

# 可选：歌手资料外部请求使用的 HTTP 代理（例如 V2Ray 的本地 HTTP 监听端口）
artist-metadata:
  proxy-host: ${ARTIST_METADATA_PROXY_HOST:}
  proxy-port: ${ARTIST_METADATA_PROXY_PORT:0}
  # 歌手资料按 网易云 → 百度百科 →（可选）维基百科 的顺序取，第一个有结果者即采用。
  # 网易云直连即可；百度百科用于补中文歌手（网易云常缺简介）；维基链门槛过严故默认关闭。
  wikimedia-fallback-enabled: ${ARTIST_METADATA_WIKIMEDIA_FALLBACK:false}
  # 网易云对高频访问敏感，请求间隔低于此值可能返回 code 405。
  netease-throttle-millis: ${ARTIST_METADATA_NETEASE_THROTTLE:900}
  # 百度百科的请求间隔。
  baike-throttle-millis: ${ARTIST_METADATA_BAIKE_THROTTLE:600}
  # Wikidata 补充国籍/性别（读 P27/P21 结构化属性，带 P106 职业门禁防同名错配）。
  # 默认关闭：实测对匿名调用限流很严（一轮出现 47 次 HTTP 429），且每次都要经境外代理，
  # 单轮补全会被拖到几十分钟才处理几十位。百度百科国内直连稳定、已能覆盖中文与部分外文
  # 歌手的国籍/性别，因此以它为主力；网络条件好时可置 true 作为加强项。
  wikidata-enabled: ${ARTIST_METADATA_WIKIDATA_ENABLED:false}
  wikidata-throttle-millis: ${ARTIST_METADATA_WIKIDATA_THROTTLE:600}
